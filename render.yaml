# Render blueprint: the duel server (invite rooms and the live duel link). The game itself is on GitHub Pages,
# but this service serves it too, from the same build.
services:
  - type: web
    name: playshatranj   # the service name sets the address: https://playshatranj.onrender.com
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"

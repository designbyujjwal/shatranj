<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 -10 750 165"
  width="750"
  height="165"
  fill="none"
>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&amp;display=swap');
      .shatranj-banner-title {
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-rendering: geometricPrecision;
      }
    </style>

    <!-- Deep Ambient Elevation Shadow for the hanging cloth & stand -->
    <filter id="bannerElevationShadow" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Stand Drop Shadow -->
    <filter id="bannerStandShadow" x="-10%" y="-40%" width="120%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <!-- Text & Badge Crisp Shadow -->
    <filter id="bannerTextShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#140001" flood-opacity="0.8" />
    </filter>

    <!-- Soft Vertical Flute Blur -->
    <filter id="bannerFluteBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <!-- Burnished Wrought Iron Crossbar Gradient -->
    <linearGradient id="ironRodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c3f47" />
      <stop offset="28%" stop-color="#727785" />
      <stop offset="55%" stop-color="#2a2c33" />
      <stop offset="100%" stop-color="#0e0f12" />
    </linearGradient>

    <!-- Razor Steel Spearhead Blade Gradient -->
    <linearGradient id="spearBladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b909e" />
      <stop offset="42%" stop-color="#e2e5f0" />
      <stop offset="55%" stop-color="#555861" />
      <stop offset="100%" stop-color="#1b1c20" />
    </linearGradient>

    <!-- Weathered Antique Brass / Gold Fittings Gradient -->
    <linearGradient id="brassFittingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eed07a" />
      <stop offset="38%" stop-color="#b2822d" />
      <stop offset="72%" stop-color="#644410" />
      <stop offset="100%" stop-color="#2b1a04" />
    </linearGradient>

    <!-- Weathered Brown Leather Straps Gradient -->
    <linearGradient id="leatherTieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5f3619" />
      <stop offset="50%" stop-color="#3d200c" />
      <stop offset="100%" stop-color="#1c0e04" />
    </linearGradient>

    <!-- Rich Crimson Velvet Base Gradient with subtle horizontal variation -->
    <linearGradient id="fabricBaseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#240002" />
      <stop offset="8%" stop-color="#420105" />
      <stop offset="20%" stop-color="#6f0207" />
      <stop offset="35%" stop-color="#8c040b" />
      <stop offset="50%" stop-color="#550206" />
      <stop offset="65%" stop-color="#8c040b" />
      <stop offset="80%" stop-color="#6f0207" />
      <stop offset="92%" stop-color="#420105" />
      <stop offset="100%" stop-color="#240002" />
    </linearGradient>

    <!-- Vertical Curtain Shading: Dark top gathered shadow + Bottom soot/fade -->
    <linearGradient id="curtainVerticalShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050001" stop-opacity="0.95" />
      <stop offset="10%" stop-color="#120002" stop-opacity="0.55" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="88%" stop-color="#100001" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#050000" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gold Trim Gradient matching reference image -->
    <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#feeaa7" />
      <stop offset="30%" stop-color="#deb44d" />
      <stop offset="70%" stop-color="#a6731e" />
      <stop offset="100%" stop-color="#6b460d" />
    </linearGradient>

    <!-- Deep Crimson Velvet Badge Gradient matching reference image -->
    <radialGradient id="badgeCrimsonGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#820b10" />
      <stop offset="55%" stop-color="#4f0105" />
      <stop offset="100%" stop-color="#220002" />
    </radialGradient>

    <!-- Imperial Gold Crown Gradient -->
    <linearGradient id="crownGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3c6" />
      <stop offset="30%" stop-color="#f7ca68" />
      <stop offset="70%" stop-color="#d68e37" />
      <stop offset="100%" stop-color="#9a531a" />
    </linearGradient>

    <!-- Pearlescent Silver-White SHATRANJ Lettering Gradient matching reference image -->
    <linearGradient id="silverTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f8f6f2" />
      <stop offset="65%" stop-color="#e2e4e8" />
      <stop offset="90%" stop-color="#c5c8d0" />
      <stop offset="100%" stop-color="#9ea2ac" />
    </linearGradient>

    <!-- Battle-Torn Drooping Curtain Boundary -->
    <clipPath id="curtainClothClip">
      <path
        d="
          M 78,16
          L 672,16
          L 672,134
          L 656,128 L 642,139 L 626,127 L 612,140 L 596,126 L 580,140 L 564,127 L 548,141 L 532,126 L 518,140 L 504,126 L 490,140 L 474,126 L 458,139 L 438,127 L 420,140 L 398,127 L 378,140 L 356,127 L 338,140 L 320,127 L 304,139 L 286,127 L 268,139 L 250,128 L 232,140 L 216,127 L 200,138 L 182,127 L 164,139 L 148,127 L 134,138 L 116,128 L 102,137 L 90,128 L 78,134
          L 78,16
          Z
        "
      />
    </clipPath>

    <!-- Master Crown Badge Definition (Matching user reference image exactly) -->
    <g id="shatranjCrownBadge">
      <!-- Outer Squircle with Thin Gold Border -->
      <rect
        x="0"
        y="0"
        width="58"
        height="58"
        rx="13"
        fill="url(#badgeCrimsonGrad)"
        stroke="url(#goldRimGrad)"
        stroke-width="2.2"
      />
      <!-- Subtle Inner Gold Filigree Bevel -->
      <rect
        x="2.4"
        y="2.4"
        width="53.2"
        height="53.2"
        rx="11"
        fill="none"
        stroke="#ffffff"
        stroke-width="0.6"
        opacity="0.18"
      />

      <!-- Clean Minimalist 3-Point Geometric Crown Silhouette matching user reference -->
      <g transform="translate(5.0, 5.5) scale(0.48)">
        <polygon
          points="27,78 73,78 87,34 65,48 50,20 35,48 13,34"
          fill="url(#crownGoldGrad)"
          stroke="url(#crownGoldGrad)"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
      </g>
    </g>
  </defs>

  <!-- =========================================================================
       1. HANGING CURTAIN / BATTLE BANNER CLOTH BODY
       ========================================================================= -->
  <g id="curtain-banner-group" filter="url(#bannerElevationShadow)">
    <!-- CLIPPED CLOTH BODY -->
    <g clip-path="url(#curtainClothClip)">
      <!-- 1. Deep Royal Crimson Velvet Fill -->
      <rect x="50" y="10" width="650" height="140" fill="url(#fabricBaseGrad)" />

      <!-- 2. Vertical Curtain Flutes (Soft columnar drapery folds) -->
      <g filter="url(#bannerFluteBlur)" opacity="0.6">
        <path d="M 125,16 L 124,136" stroke="#0e0001" stroke-width="14" />
        <path d="M 180,16 L 179,136" stroke="#0e0001" stroke-width="12" />
        <path d="M 235,16 L 234,136" stroke="#0e0001" stroke-width="15" />
        <path d="M 300,16 L 299,136" stroke="#0e0001" stroke-width="12" />
        <path d="M 375,16 L 375,136" stroke="#0e0001" stroke-width="10" opacity="0.5" />
        <path d="M 450,16 L 451,136" stroke="#0e0001" stroke-width="12" />
        <path d="M 515,16 L 516,136" stroke="#0e0001" stroke-width="15" />
        <path d="M 570,16 L 571,136" stroke="#0e0001" stroke-width="12" />
        <path d="M 625,16 L 626,136" stroke="#0e0001" stroke-width="14" />

        <!-- Highlight Ribs -->
        <path d="M 152,16 L 152,136" stroke="#ff9ca3" stroke-width="5" opacity="0.22" />
        <path d="M 207,16 L 207,136" stroke="#ff9ca3" stroke-width="4.5" opacity="0.20" />
        <path d="M 268,16 L 268,136" stroke="#ff9ca3" stroke-width="5.5" opacity="0.22" />
        <path d="M 337,16 L 337,136" stroke="#ff9ca3" stroke-width="4" opacity="0.18" />
        <path d="M 412,16 L 412,136" stroke="#ff9ca3" stroke-width="4" opacity="0.18" />
        <path d="M 482,16 L 482,136" stroke="#ff9ca3" stroke-width="5.5" opacity="0.22" />
        <path d="M 542,16 L 542,136" stroke="#ff9ca3" stroke-width="4.5" opacity="0.20" />
        <path d="M 598,16 L 598,136" stroke="#ff9ca3" stroke-width="5" opacity="0.22" />
      </g>

      <!-- 3. Vertical Curtain Shading Overlay -->
      <rect x="50" y="12" width="650" height="138" fill="url(#curtainVerticalShade)" />
    </g>

    <!-- Scorched Edge Rim on the shredded bottom hem and sides -->
    <path
      d="
        M 78,16
        C 135,15.5 210,16 375,15.5 C 540,16 615,15.5 672,16
        L 672,134
        L 656,128 L 642,139 L 626,127 L 612,140 L 596,126 L 580,140 L 564,127 L 548,141 L 532,126 L 518,140 L 504,126 L 490,140 L 474,126 L 458,139 L 438,127 L 420,140 L 398,127 L 378,140 L 356,127 L 338,140 L 320,127 L 304,139 L 286,127 L 268,139 L 250,128 L 232,140 L 216,127 L 200,138 L 182,127 L 164,139 L 148,127 L 134,138 L 116,128 L 102,137 L 90,128 L 78,134
        Z
      "
      fill="none"
      stroke="#120002"
      stroke-width="1.2"
      opacity="0.9"
    />

    <!-- =========================================================================
         2. HERALDIC BADGES AND "SHATRANJ" TYPOGRAPHY
         ========================================================================= -->
    <g id="heraldic-branding-layer" filter="url(#bannerTextShadow)">
      <!-- Left Golden Crown Badge -->
      <g id="badge-left" transform="translate(108, 46)">
        <use href="#shatranjCrownBadge" />
      </g>

      <!-- Center SHATRANJ Title -->
      <g id="shatranj-title-group">
        <text
          x="375"
          y="84"
          text-anchor="middle"
          fill="url(#silverTextGrad)"
          class="shatranj-banner-title"
          font-family="'Cinzel', Georgia, serif"
          font-size="42"
          font-weight="500"
          letter-spacing="1.5"
        >SHATRANJ</text>
      </g>

      <!-- Right Golden Crown Badge -->
      <g id="badge-right" transform="translate(584, 46)">
        <use href="#shatranjCrownBadge" />
      </g>
    </g>
  </g>

  <!-- =========================================================================
       3. STAND GRAPHICS & SUSPENSION HARDWARE (Spearhead crossbar & fasteners)
       ========================================================================= -->
  <g id="shatranj-banner-stand" filter="url(#bannerStandShadow)">
    <!-- 1. Horizontal Wrought Iron Crossbar -->
    <rect
      x="62"
      y="13.5"
      width="626"
      height="5.5"
      rx="2.2"
      fill="url(#ironRodGrad)"
      stroke="#08080a"
      stroke-width="0.8"
    />
    <!-- Polished Top Specular Ridge Line -->
    <line
      x1="68"
      y1="14.2"
      x2="682"
      y2="14.2"
      stroke="#c4c9d8"
      stroke-width="0.75"
      opacity="0.88"
    />

    <!-- 2. Left Spear Finial -->
    <g id="stand-finial-left">
      <rect
        x="64"
        y="12"
        width="7"
        height="8.5"
        rx="1.5"
        fill="url(#brassFittingGrad)"
        stroke="#1a1104"
        stroke-width="0.6"
      />
      <circle cx="67.5" cy="16.2" r="1.2" fill="#ffd470" />
      <path
        d="M 64,16.2 L 52,11.5 L 34,16.2 L 52,21 L 64,16.2 Z"
        fill="url(#spearBladeGrad)"
        stroke="#121317"
        stroke-width="0.8"
      />
      <line
        x1="34"
        y1="16.2"
        x2="64"
        y2="16.2"
        stroke="#ffffff"
        stroke-width="0.8"
        opacity="0.9"
      />
    </g>

    <!-- 3. Right Spear Finial -->
    <g id="stand-finial-right">
      <rect
        x="679"
        y="12"
        width="7"
        height="8.5"
        rx="1.5"
        fill="url(#brassFittingGrad)"
        stroke="#1a1104"
        stroke-width="0.6"
      />
      <circle cx="682.5" cy="16.2" r="1.2" fill="#ffd470" />
      <path
        d="M 686,16.2 L 698,11.5 L 716,16.2 L 698,21 L 686,16.2 Z"
        fill="url(#spearBladeGrad)"
        stroke="#121317"
        stroke-width="0.8"
      />
      <line
        x1="686"
        y1="16.2"
        x2="716"
        y2="16.2"
        stroke="#ffffff"
        stroke-width="0.8"
        opacity="0.9"
      />
    </g>

    <!-- 4. Left Vertical Staff Post & Upward Spearhead -->
    <g id="stand-post-left">
      <rect
        x="78.5"
        y="11"
        width="5"
        height="32"
        rx="1.5"
        fill="url(#ironRodGrad)"
        stroke="#090a0d"
        stroke-width="0.6"
      />
      <rect
        x="77.5"
        y="12.5"
        width="7"
        height="7.5"
        rx="1.2"
        fill="url(#brassFittingGrad)"
        stroke="#1e1305"
        stroke-width="0.6"
      />
      <circle cx="81" cy="16.2" r="1.4" fill="#ffd470" />
      <path
        d="M 81,-6 L 85.5,6 L 81,11 L 76.5,6 Z"
        fill="url(#spearBladeGrad)"
        stroke="#121317"
        stroke-width="0.75"
      />
      <line
        x1="81"
        y1="-6"
        x2="81"
        y2="11"
        stroke="#ffffff"
        stroke-width="0.75"
        opacity="0.85"
      />
    </g>

    <!-- 5. Right Vertical Staff Post & Upward Spearhead -->
    <g id="stand-post-right">
      <rect
        x="666.5"
        y="11"
        width="5"
        height="32"
        rx="1.5"
        fill="url(#ironRodGrad)"
        stroke="#090a0d"
        stroke-width="0.6"
      />
      <rect
        x="665.5"
        y="12.5"
        width="7"
        height="7.5"
        rx="1.2"
        fill="url(#brassFittingGrad)"
        stroke="#1e1305"
        stroke-width="0.6"
      />
      <circle cx="669" cy="16.2" r="1.4" fill="#ffd470" />
      <path
        d="M 669,-6 L 673.5,6 L 669,11 L 664.5,6 Z"
        fill="url(#spearBladeGrad)"
        stroke="#121317"
        stroke-width="0.75"
      />
      <line
        x1="669"
        y1="-6"
        x2="669"
        y2="11"
        stroke="#ffffff"
        stroke-width="0.75"
        opacity="0.85"
      />
    </g>

    <!-- 6. Hanging Cord Rings & Top Suspension Cords -->
    <g id="stand-suspension-mounts">
      <circle
        cx="180"
        cy="13.5"
        r="4.2"
        fill="none"
        stroke="url(#brassFittingGrad)"
        stroke-width="1.4"
      />
      <path
        d="M 180,9.3 C 180,2 178,-6 175,-14"
        stroke="#2a2015"
        stroke-width="1.3"
        stroke-dasharray="3,1"
        opacity="0.85"
      />
      <circle
        cx="570"
        cy="13.5"
        r="4.2"
        fill="none"
        stroke="url(#brassFittingGrad)"
        stroke-width="1.4"
      />
      <path
        d="M 570,9.3 C 570,2 572,-6 575,-14"
        stroke="#2a2015"
        stroke-width="1.3"
        stroke-dasharray="3,1"
        opacity="0.85"
      />
    </g>

    <!-- 7. Medieval Leather Straps & Ties Binding Cloth to Bar -->
    <g id="stand-leather-bindings" fill="url(#leatherTieGrad)" stroke="#140802" stroke-width="0.6">
      <g transform="translate(124, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1,6.5 L 0.5,13 L 2,12.5 L 2.5,6.5 Z" />
      </g>
      <g transform="translate(174, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1.2,6.5 L 0.8,12 L 2.2,11.5 L 2.6,6.5 Z" />
      </g>
      <g transform="translate(224, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1,6.5 L 0.5,13.5 L 2.2,13 L 2.5,6.5 Z" />
      </g>
      <g transform="translate(284, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1.2,6.5 L 1.5,12 L 2.6,11.8 L 2.5,6.5 Z" />
      </g>
      <g transform="translate(344, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1,6.5 L 0.6,12.5 L 2,12 L 2.5,6.5 Z" />
      </g>
      <g transform="translate(404, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1.5,6.5 L 1.8,12.5 L 2.8,12 L 2.5,6.5 Z" />
      </g>
      <g transform="translate(464, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1,6.5 L 0.5,13 L 2,12.5 L 2.5,6.5 Z" />
      </g>
      <g transform="translate(524, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1.2,6.5 L 1,12 L 2.4,11.5 L 2.5,6.5 Z" />
      </g>
      <g transform="translate(584, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1,6.5 L 0.5,13.5 L 2,13 L 2.5,6.5 Z" />
      </g>
      <g transform="translate(634, 13)">
        <rect x="0" y="0" width="3.5" height="6.5" rx="1" />
        <path d="M 1.2,6.5 L 1.5,12.5 L 2.6,12 L 2.5,6.5 Z" />
      </g>
    </g>
  </g>
</svg>
